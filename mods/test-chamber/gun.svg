<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140">
  <!-- An original handheld portal device, side view: rear power cell, lab-white body with a
       core window, a grip, and a front emitter ring split blue (top) and orange (bottom). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd5da"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8f6ff"/><stop offset="0.45" stop-color="#8fd0ff"/><stop offset="1" stop-color="#2fa8ff"/>
    </radialGradient>
  </defs>
  <!-- grip -->
  <path d="M86 92 L116 92 L108 134 Q107 138 102 138 L80 138 Q76 138 77 133 Z" fill="#2b333b"/>
  <rect x="84" y="104" width="22" height="4" rx="2" fill="#3d4750"/>
  <rect x="82" y="114" width="22" height="4" rx="2" fill="#3d4750"/>
  <!-- rear power cell -->
  <rect x="14" y="40" width="44" height="58" rx="14" fill="#2b333b"/>
  <rect x="22" y="50" width="6" height="38" rx="3" fill="#2fa8ff" opacity="0.85"/>
  <rect x="32" y="50" width="6" height="38" rx="3" fill="#2fa8ff" opacity="0.55"/>
  <rect x="42" y="50" width="6" height="38" rx="3" fill="#2fa8ff" opacity="0.3"/>
  <!-- body -->
  <path d="M50 44 Q50 30 66 30 L170 30 Q186 30 190 44 L196 68 L190 94 Q186 104 172 104 L66 104 Q50 104 50 92 Z" fill="url(#body)" stroke="#1d2329" stroke-width="4" stroke-linejoin="round"/>
  <!-- top rail and vents -->
  <rect x="78" y="20" width="76" height="12" rx="5" fill="#2b333b"/>
  <rect x="88" y="23" width="10" height="6" rx="2" fill="#5c6670"/>
  <rect x="104" y="23" width="10" height="6" rx="2" fill="#5c6670"/>
  <rect x="120" y="23" width="10" height="6" rx="2" fill="#5c6670"/>
  <!-- core window -->
  <rect x="76" y="56" width="92" height="22" rx="11" fill="#0b1a26"/>
  <rect x="82" y="62" width="80" height="10" rx="5" fill="url(#core)"/>
  <!-- seam line -->
  <path d="M58 86 L182 86" stroke="#9aa3ab" stroke-width="2"/>
  <!-- emitter -->
  <circle cx="204" cy="67" r="30" fill="#1d2329"/>
  <path d="M176 67 A28 28 0 0 1 232 67" fill="none" stroke="#2fa8ff" stroke-width="7"/>
  <path d="M232 67 A28 28 0 0 1 176 67" fill="none" stroke="#ff8a1f" stroke-width="7"/>
  <circle cx="204" cy="67" r="15" fill="#0b1a26"/>
  <circle cx="204" cy="67" r="8" fill="url(#core)"/>
</svg>
