<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#dde1e4"/>
      <path d="M80 0H0V80" fill="none" stroke="#cdd2d6" stroke-width="2"/>
    </pattern>
    <filter id="glowB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowO" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="vortexB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b1a26"/><stop offset="0.7" stop-color="#11405f"/><stop offset="1" stop-color="#2fa8ff"/>
    </radialGradient>
    <radialGradient id="vortexO" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#261405"/><stop offset="0.7" stop-color="#6a3610"/><stop offset="1" stop-color="#ff8a1f"/>
    </radialGradient>
  </defs>
